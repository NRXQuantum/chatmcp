name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        include:
          - os: ubuntu-22.04
            apk_build: true
          - os: macos-latest
            apk_build: false
          - os: windows-latest
            apk_build: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        if: matrix.apk_build
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.apk_build
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.5'

      - name: Create empty .env file
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android Signing
        if: matrix.apk_build && github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystore
          
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > android/app/keystore/release.jks
            echo "SIGNING_STORE_PATH=keystore/release.jks" >> $GITHUB_ENV
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> $GITHUB_ENV
            echo "✅ Android Signature Config Set"
          else
            echo "⚠️  No signature config found, using debug signing"
          fi
      
      - name: Activate FastForge
        run: dart pub global activate fastforge

      - name: Build linux/android package
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev locate libsqlite3-dev fuse libfuse2 libstdc++-12-dev patchelf
          sudo updatedb
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/
          fastforge release --name=linux
          fastforge release --name=android

      - name: Verify AppImage GLIBC compatibility (Pop!_OS 22.04)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in dist/**/*AppImage dist/*.AppImage; do
            echo "Checking $f"
            chmod +x "$f"
            "$f" --appimage-extract >/dev/null 2>&1 || true
            if [ -d squashfs-root/usr/lib ]; then
              if strings squashfs-root/usr/lib/libstdc++.so.6 | grep -E 'GLIBC_2\.(36|37|38|39)' -q; then
                echo "❌ $f contains libstdc++ requiring newer GLIBC" >&2
                exit 1
              fi
            fi
            rm -rf squashfs-root
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No AppImage files found under dist/. Skipping check."
          else
            echo "✅ AppImage libstdc++ is compatible with GLIBC 2.35 hosts."
          fi

      - name: Setup Node.js for macOS
        if: matrix.os == 'macos-latest'
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: macos npm install
        if: matrix.os == 'macos-latest'
        run: |
          npm install -g appdmg
        
      - name: Build macos package
        if: matrix.os == 'macos-latest'
        run: |
          fastforge release --name=macos

      - name: Build windows package
        if: matrix.os == 'windows-latest'
        run: |
          fastforge release --name=windows
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Normalize release asset names
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets

          copy_first() {
            local pattern="$1"
            local output="$2"
            local input
            input="$(find dist -type f -name "$pattern" | head -n 1 || true)"
            if [ -z "$input" ]; then
              echo "Missing expected artifact: $pattern" >&2
              exit 1
            fi
            cp "$input" "release-assets/$output"
          }

          copy_first "*.apk" "chatmcp-${VERSION}-android.apk"
          copy_first "*.AppImage" "chatmcp-${VERSION}-linux.AppImage"
          copy_first "*.deb" "chatmcp-${VERSION}-linux.deb"
          copy_first "*.rpm" "chatmcp-${VERSION}-linux.rpm"
          copy_first "*.dmg" "chatmcp-${VERSION}-macos.dmg"
          copy_first "*.msix" "chatmcp-${VERSION}-windows.msix"
          copy_first "*.zip" "chatmcp-${VERSION}-windows.zip"

      - name: Create release checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
